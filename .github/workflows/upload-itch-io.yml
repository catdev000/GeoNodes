name: Upload Blender Assets to itch.io

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Butler and deploy to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V
          
          mkdir -p assets
          cp -r ./Geometry\ Nodes/ assets/
          cp -r ./Shader\ Nodes/ assets/

          ./butler push assets/ catdev000/geonodes:assets
